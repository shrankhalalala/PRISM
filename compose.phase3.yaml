x-app: &app
  build: .
  image: prism-phase3:local
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:mode=1777,size=128m
  volumes:
    - phase3_artifacts:/app/artifacts
  environment: &environment
    PRISM_DATABASE_URL: "postgresql://prism:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/prism"
    PRISM_REDIS_URL: "redis://redis:6379/0"
    NEO4J_URI: "bolt://neo4j:7687"
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}"
    PRISM_OPERATOR_TOKEN: "${PRISM_OPERATOR_TOKEN:?Set PRISM_OPERATOR_TOKEN}"
    PRISM_ALLOW_LOCAL_OPERATOR: "0"
    PRISM_REQUIRE_SERVICES: "1"
    PRISM_USE_DURABLE_LIVE: "1"
    PRISM_WARM_MODELS: "1"
    PRISM_DIAGNOSIS_STORE: "neo4j"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    neo4j:
      condition: service_healthy
services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:5050:5050"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/api/readiness',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 45s
  worker:
    <<: *app
    command: ["celery", "-A", "prism.operations.tasks:celery", "worker", "--pool=solo", "--concurrency=1", "--loglevel=WARNING"]
    mem_limit: 1g
  beat:
    <<: *app
    command: ["celery", "-A", "prism.operations.tasks:celery", "beat", "--schedule", "/app/artifacts/celerybeat-schedule", "--pidfile", "/app/artifacts/celerybeat.pid", "--loglevel=WARNING"]
    mem_limit: 256m
  collector:
    <<: *app
    command: ["python", "-m", "scripts.collect_live"]
    mem_limit: 512m
  initialize:
    <<: *app
    restart: "no"
    command: ["python", "-m", "scripts.initialize_phase3"]
    mem_limit: 512m
volumes:
  phase3_artifacts:
