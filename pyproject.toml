[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-grid"
version = "0.2.0"
description = "PRISM academic grid decision-support prototype"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "networkx>=3.3,<4", "pandas>=2.2,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20,<7"]

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.setuptools.package-data]
prism = ["templates/*.html", "static/*"]
